name: metacircuit-cyclic-backend

on:
  push:
    branches: [agent/geometric-wave-state-v01]
    paths:
      - 'map/metacircuit_cyclic_backend.py'
      - 'tests/test_metacircuit_cyclic_backend.py'
      - 'results/cyclic_c101_equivariant_port.json'
      - '.github/workflows/metacircuit-cyclic-backend.yml'
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Focused tests
        run: pytest -q tests/test_metacircuit_cyclic_backend.py
      - run: mkdir -p results
      - name: Lower C101 characters to resonator companion form
        run: python map/metacircuit_cyclic_backend.py --json > results/metacircuit_cyclic_backend.json
      - uses: actions/upload-artifact@v4
        with:
          name: metacircuit-cyclic-backend
          path: results/metacircuit_cyclic_backend.json
