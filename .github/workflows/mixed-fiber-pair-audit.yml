name: mixed-fiber-pair-audit

on:
  push:
    branches: [agent/geometric-wave-state-v01]
    paths:
      - 'map/mixed_fiber_compiler_probe.py'
      - 'map/mixed_fiber_pair_audit.py'
      - 'tests/test_mixed_fiber_pair_audit.py'
      - '.github/workflows/mixed-fiber-pair-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Focused paired-history tests
        run: pytest -q tests/test_mixed_fiber_pair_audit.py
      - run: mkdir -p results
      - name: Train and audit paired histories
        run: python map/mixed_fiber_pair_audit.py --json > results/mixed_fiber_pair_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: mixed-fiber-pair-audit
          path: results/mixed_fiber_pair_audit.json
