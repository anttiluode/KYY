name: frontier-direction-control

on:
  push:
    branches:
      - main
    paths:
      - 'experiments/frontier_direction_control.py'
      - '.github/workflows/frontier-direction-control.yml'
  workflow_dispatch:

jobs:
  quick-direction-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: mkdir -p results
      - name: Run fixed-span ordered frontier gate
        run: |
          python experiments/frontier_direction_control.py --quick --device cpu | tee results/frontier-direction-quick.txt
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-direction-quick
          path: |
            results/frontier-direction-quick.txt
            results/frontier-direction-*.json
