name: frontier-direction-control

on:
  push:
    branches:
      - main
    paths:
      - 'experiments/frontier_direction_control.py'
      - '.github/workflows/frontier-direction-control.yml'
  workflow_dispatch:

jobs:
  replicated-direction-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: mkdir -p results
      - name: Run five-seed fixed-span ordered frontier gate
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python experiments/frontier_direction_control.py \
            --device cpu \
            --model-seeds 0 1 2 3 4 \
            --steps 300 \
            --eval-batches 8 \
            --eval-batch-size 256 \
            --shuffle-draws 8 \
            --log-every 100 \
            | tee results/frontier-direction-replicated.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier-direction-replicated
          path: |
            results/frontier-direction-replicated.txt
            results/frontier-direction-*.json
