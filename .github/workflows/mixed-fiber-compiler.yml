name: mixed-fiber-compiler

on:
  push:
    branches: [agent/geometric-wave-state-v01]
    paths:
      - 'map/mixed_fiber_compiler_probe.py'
      - 'tests/test_mixed_fiber_compiler_probe.py'
      - '.github/workflows/mixed-fiber-compiler.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Focused tests
        run: pytest -q tests/test_mixed_fiber_compiler_probe.py
      - run: mkdir -p results
      - name: Train and compile mixed digital-analog fibers
        run: python map/mixed_fiber_compiler_probe.py --json > results/mixed_fiber_compiler.json
      - uses: actions/upload-artifact@v4
        with:
          name: mixed-fiber-compiler
          path: results/mixed_fiber_compiler.json
