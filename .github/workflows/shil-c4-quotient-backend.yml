name: shil-c4-quotient-backend

on:
  push:
    branches: [agent/geometric-wave-state-v01]
    paths:
      - 'map/shil_c4_quotient_backend.py'
      - 'tests/test_shil_c4_quotient_backend.py'
      - '.github/workflows/shil-c4-quotient-backend.yml'
  workflow_dispatch:

jobs:
  quotient:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install numpy pytest
      - name: Focused tests
        run: pytest -q tests/test_shil_c4_quotient_backend.py
      - run: mkdir -p results
      - name: Compile and simulate physical C4 quotient
        run: python map/shil_c4_quotient_backend.py --json > results/shil_c4_quotient_backend_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: shil-c4-quotient-backend
          path: results/shil_c4_quotient_backend_summary.json
