name: dihedral-stabilizer-certificate

on:
  push:
    branches:
      - agent/geometric-wave-state-v01
    paths:
      - 'map/dihedral_stabilizer_certificate.py'
      - 'tests/test_dihedral_stabilizer_certificate.py'
      - '.github/workflows/dihedral-stabilizer-certificate.yml'
  workflow_dispatch:

jobs:
  d101-stabilizer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run focused tests
        run: pytest -q tests/test_dihedral_stabilizer_certificate.py
      - run: mkdir -p results
      - name: Train, jointly legalize, and certify D101 prototypes
        run: |
          python map/dihedral_stabilizer_certificate.py \
            --n 101 \
            --modes 8 \
            --seeds 0 1 2 3 4 \
            --train-length 16 \
            --train-steps 2200 \
            --batch-size 128 \
            --max-increment 4 \
            --reflection-probability 0.25 \
            --reflection-scale 0.25 \
            --lr 0.003 \
            --random-start \
            --json > results/dihedral_d101_stabilizer_certificate.json
      - uses: actions/upload-artifact@v4
        with:
          name: dihedral-d101-stabilizer-certificate
          path: results/dihedral_d101_stabilizer_certificate.json
