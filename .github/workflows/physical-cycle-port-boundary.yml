name: physical-cycle-port-boundary

on:
  push:
    branches: [agent/geometric-wave-state-v01]
    paths:
      - 'map/physical_cycle_port_boundary.py'
      - 'tests/test_physical_cycle_port_boundary.py'
      - '.github/workflows/physical-cycle-port-boundary.yml'
  workflow_dispatch:

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Focused tests
        run: pytest -q tests/test_physical_cycle_port_boundary.py
      - run: mkdir -p results
      - name: Finite-horizon port calibration versus operator legalization
        run: python map/physical_cycle_port_boundary.py --json > results/physical_cycle_port_boundary.json
      - uses: actions/upload-artifact@v4
        with:
          name: physical-cycle-port-boundary
          path: results/physical_cycle_port_boundary.json
