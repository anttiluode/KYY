name: metacircuit-continuous-backend

on:
  push:
    branches: [agent/geometric-wave-state-v01]
    paths:
      - 'map/metacircuit_cyclic_backend.py'
      - 'map/metacircuit_frequency_design.py'
      - 'map/metacircuit_continuous_backend.py'
      - 'tests/test_metacircuit_continuous_backend.py'
      - '.github/workflows/metacircuit-continuous-backend.yml'
  workflow_dispatch:

jobs:
  correction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install numpy pytest
      - name: Focused tests
        run: pytest -q tests/test_metacircuit_continuous_backend.py
      - run: mkdir -p results
      - name: Recompute backend using continuous physical resonator law
        run: python map/metacircuit_continuous_backend.py --json > results/metacircuit_continuous_backend_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: metacircuit-continuous-backend
          path: results/metacircuit_continuous_backend_summary.json
