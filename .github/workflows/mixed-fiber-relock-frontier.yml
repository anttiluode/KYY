name: mixed-fiber-relock-frontier

on:
  push:
    branches: [agent/geometric-wave-state-v01]
    paths:
      - 'map/mixed_fiber_compiler_probe.py'
      - 'map/mixed_fiber_noise_boundary.py'
      - 'map/mixed_fiber_relock_boundary.py'
      - 'map/mixed_fiber_relock_frontier.py'
      - 'tests/test_mixed_fiber_relock_frontier.py'
      - '.github/workflows/mixed-fiber-relock-frontier.yml'
  workflow_dispatch:

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Focused tests
        run: pytest -q tests/test_mixed_fiber_relock_frontier.py
      - run: mkdir -p results
      - name: Sweep noise versus relock interval
        run: python map/mixed_fiber_relock_frontier.py --json > results/mixed_fiber_relock_frontier.json
      - uses: actions/upload-artifact@v4
        with:
          name: mixed-fiber-relock-frontier
          path: results/mixed_fiber_relock_frontier.json
