name: harmonic-cross-modulus

on:
  push:
    paths:
      - '.github/workflows/harmonic-cross-modulus.yml'
  workflow_dispatch:

jobs:
  cross-modulus:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - n: 31
            modes: 8
          - n: 61
            modes: 8
          - n: 101
            modes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: mkdir -p results
      - name: Run random-start legalization falsifier
        run: >-
          python map/harmonic_training_probe.py
          --n ${{ matrix.n }}
          --modes ${{ matrix.modes }}
          --variants learned low_coherence
          --seeds 0 1 2
          --train-length 16
          --test-lengths 16 64 256 1024
          --steps 1500
          --batch-size 128
          --eval-batch-size 64
          --max-increment 4
          --search-trials 500
          --angle-error 0.001
          --random-start
          --json
          > results/harmonic-random-start-n${{ matrix.n }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: harmonic-random-start-n${{ matrix.n }}
          path: results/harmonic-random-start-n${{ matrix.n }}.json
